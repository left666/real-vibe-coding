name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v0.1.1)
        required: true

permissions:
  contents: read
  # The publish authenticates with a short-lived OIDC token — npm's trusted
  # publishing — so no registry credential lives in the repository.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        # Trusted publishing needs npm 11.5.1 and Node 22.14 or newer.
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          tag="${RELEASE_TAG#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Release tag '${RELEASE_TAG}' does not match package.json version '${version}'"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Publish
        run: npm publish
